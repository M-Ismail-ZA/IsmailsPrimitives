<desc id="g01-ecosystem-map-d">Lean 4 and Mathlib's axioms support the IsmailsPrimitives repository (proof, paper and website), which in turn supports the four companion papers and the Field of Decisional Integrity. Ismail's Glossary indexes Mathlib and Ismail's Protocols checks the Field's writing; both are independent side projects.</desc>
